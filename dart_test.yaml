# Declares the tags the guard suites use, so `flutter test` does not warn about
# an unknown tag. CI can run only the guards with `flutter test --tags guard`;
# they are part of a plain `flutter test` too.
tags:
  guard:
    description: Invariant and project-identity guards that read repository files.
  slow:
    description: >-
      Guards that cost more than an assertion to run. One test carries it:
      `the flag the workflow sets is the flag the guard reads`, which spawns
      a child `flutter test` to set an environment its own process cannot
      (#245). The battery excludes it from the runs that do not need it, and
      the one mutation that does sets `slow=True`.
