# Declares the tags the guard suites use, so `flutter test` does not warn about
# an unknown tag. CI can run only the guards with `flutter test --tags guard`;
# they are part of a plain `flutter test` too.
tags:
  guard:
    description: Invariant and project-identity guards that read repository files.
  slow:
    description: >-
      Guards whose input is expensive to produce. Nothing carries this tag
      today — the test that did was reverted with #217 — but the battery
      still honours it, so the next expensive guard can opt out of being run
      once per mutation without anyone rediscovering why that matters.
