# Pushing a version tag ships.
#
# The order is the safety property: the identical gate re-runs on the tagged
# commit, then the bundle is built from secrets, scanned for permissions, and
# its signing certificate checked against the committed one — and only then
# does anything reach Play. A failure at any earlier step uploads nothing.
#
# Production is never touched here. The upload track is `internal`, and
# promotion to closed testing is a separate, manually dispatched workflow.
# Production remains a human act in the Console (owner's call, 2026-09-18).
#
# Secrets are supplied as step-level `env:` on the four steps that need them,
# never job-wide, so a step with no business seeing the keystore password does
# not have it in scope. No step prints one; a guard asserts that and refuses
# `set -x` anywhere in this directory.
name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: play-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  gate:
    # The same file the pull-request gate uses, not a copy of its steps.
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  ship:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write    # release asset upload only
    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7

      # First, so a missing secret fails in seconds rather than after a build.
      # Each is tested for emptiness; none is printed.
      - id: secrets_present
        name: Assert every secret is present
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          HS_KEYSTORE_B64: ${{ secrets.HS_KEYSTORE_B64 }}
          HS_KEYSTORE_PASS: ${{ secrets.HS_KEYSTORE_PASS }}
          HS_KEY_ALIAS: ${{ secrets.HS_KEY_ALIAS }}
          HS_KEY_PASS: ${{ secrets.HS_KEY_PASS }}
        run: |
          set -euo pipefail
          missing=""
          for name in PLAY_SERVICE_ACCOUNT_JSON HS_KEYSTORE_B64 HS_KEYSTORE_PASS HS_KEY_ALIAS HS_KEY_PASS; do
            if [ -z "${!name:-}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "missing repository secrets:$missing" >&2
            exit 1
          fi
          echo "all five secrets are present"

      # Refuses a malformed tag before anything is built. stdout is the
      # contract; it is tee'd so the log shows what the next steps will use.
      - id: version
        name: Resolve version from tag
        run: |
          set -euo pipefail
          tools/ci_version.sh "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" \
            | tee -a "$GITHUB_OUTPUT"

      - id: java
        name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - id: flutter
        name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - id: deps
        name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - id: keystore
        name: Decode the upload keystore
        env:
          HS_KEYSTORE_B64: ${{ secrets.HS_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          base64 -d <<< "$HS_KEYSTORE_B64" > "$RUNNER_TEMP/upload.keystore"
          test -s "$RUNNER_TEMP/upload.keystore"

      # Proves the decoded file is a keystore and that the store password
      # opens it, before a four-minute build discovers otherwise.
      - id: keystore_check
        name: Check the keystore opens
        env:
          HS_KEYSTORE_PASS: ${{ secrets.HS_KEYSTORE_PASS }}
          HS_KEY_ALIAS: ${{ secrets.HS_KEY_ALIAS }}
          HS_KEY_PASS: ${{ secrets.HS_KEY_PASS }}
        run: |
          set -euo pipefail
          # A PKCS12 keystore has one password: keytool ignores `-keypass` and
          # exits 0 whatever it is given, so no command can prove the key
          # password. Asserting the two secrets agree is the check that CAN
          # fail, and it belongs here — this is the only workflow on the tag
          # path, and #143 fixed the two that are not (#158).
          if [ "$HS_KEY_PASS" != "$HS_KEYSTORE_PASS" ]; then
            echo "HS_KEY_PASS differs from HS_KEYSTORE_PASS." >&2
            echo "  A PKCS12 keystore has one password; Gradle would fail with" >&2
            echo "  UnrecoverableKeyException four minutes into the build." >&2
            exit 1
          fi
          # `-alias` matters: without it this returned 0 for a keystore whose
          # alias is not the configured one, so the wrong-alias case it claims
          # to catch reached the four-minute build anyway (#138).
          keytool -list -keystore "$RUNNER_TEMP/upload.keystore" \
            -storetype PKCS12 -storepass:env HS_KEYSTORE_PASS \
            -alias "$HS_KEY_ALIAS" > /dev/null
          echo "the keystore opens, and holds the configured alias"

      # HS_RELEASE=1 makes a missing signing input a hard failure in
      # build.gradle.kts rather than a silent fall back to the debug key.
      - id: build
        name: Build the signed bundle
        env:
          HS_KEYSTORE_PATH: ${{ runner.temp }}/upload.keystore
          HS_KEYSTORE_PASS: ${{ secrets.HS_KEYSTORE_PASS }}
          HS_KEY_ALIAS: ${{ secrets.HS_KEY_ALIAS }}
          HS_KEY_PASS: ${{ secrets.HS_KEY_PASS }}
          HS_RELEASE: "1"
        run: |
          set -euo pipefail
          flutter build appbundle --release --no-pub \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}"

      - id: scan
        name: Scan the bundle for permissions
        run: tools/check_aab.sh

      - id: cert
        name: Verify the signing certificate
        run: tools/verify_upload_cert.sh

      # Written here rather than in the asset step, so the artifact carries it
      # even on a tag with no GitHub release (#138).
      - id: sidecar
        name: Write the checksum sidecar
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          sha256sum "$aab" > "$aab.sha256"
          cat "$aab.sha256"

      - id: artifact
        name: Upload the signed bundle as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: honest-sudoku-signed-${{ github.ref_name }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/bundle/release/app-release.aab.sha256
          retention-days: 30
          if-no-files-found: error

      # The release already exists: /n8-release creates it and the tag
      # together. A missing release is not a failure — the bundle is still on
      # Play and in the artifact.
      - id: asset
        name: Attach the bundle to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          # Only "not found" means skip. Treating every failure as absence let
          # a 5xx, a rate limit or a token-scope problem silently skip both the
          # upload and the hash re-verification, on a green run (#138).
          view_err="$RUNNER_TEMP/release-view.err"
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2> "$view_err"; then
            if grep -qiE 'release not found|not found \(HTTP 404\)|could not find' "$view_err"; then
              echo "no GitHub release for this tag; skipping asset"
              # A note for the summary, not a write to it. This step runs
              # before `summary`, so appending here put the line ABOVE the
              # "### Release" heading it belongs under — and it was indented
              # four columns out of line with its siblings, which is how it
              # stayed unnoticed (#180).
              echo "no GitHub release for this tag; the bundle is in the run artifact only" \
                > "$RUNNER_TEMP/no-release-note"
              exit 0
            fi
            echo "gh release view failed for a reason other than not-found:" >&2
            cat "$view_err" >&2
            exit 1
          fi
          gh release upload "$GITHUB_REF_NAME" "$aab" "$aab.sha256" --clobber
          gh release download "$GITHUB_REF_NAME" --pattern 'app-release.aab' \
            --dir "$RUNNER_TEMP/verify" --clobber
          local_hash="$(sha256sum "$aab" | cut -d' ' -f1)"
          remote_hash="$(sha256sum "$RUNNER_TEMP/verify/app-release.aab" | cut -d' ' -f1)"
          if [ "$local_hash" != "$remote_hash" ]; then
            echo "the uploaded asset does not match what was built" >&2
            exit 1
          fi
          echo "asset attached and its hash re-verified"

      # Last, so that every verification above has already passed.
      - id: play
        name: Upload to the Play internal track
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.honestarcade.sudoku
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed

      - id: summary
        name: Write the summary
        if: always()
        # TAG through env, never interpolated into the script: GitHub pastes
        # `${{ }}` in as text before bash runs, and `v1.0.0$(id)` is a legal
        # tag name that matches this workflow's own trigger (#142).
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          aab=build/app/outputs/bundle/release/app-release.aab
          {
            echo "### Release $TAG"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| version name | ${{ steps.version.outputs.name }} |"
            echo "| version code | ${{ steps.version.outputs.code }} |"
            echo "| package | com.honestarcade.sudoku |"
            echo "| track | internal |"
            if [ -f "$aab" ]; then
              echo "| bundle SHA-256 | $(sha256sum "$aab" | cut -d' ' -f1) |"
            fi
            echo ""
            echo "Native debug symbols are not uploaded: this is a Flutter"
            echo "default build with no obfuscation mapping to attach."
            if [ -f "$RUNNER_TEMP/no-release-note" ]; then
              echo ""
              cat "$RUNNER_TEMP/no-release-note"
            fi
            echo ""
            echo "Play Console: https://play.google.com/console"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: name_failure
        name: Name the failed step
        if: failure()
        run: |
          set -euo pipefail
          echo '${{ toJSON(steps) }}' \
            | grep -B2 '"outcome": "failure"' \
            | tee -a "$GITHUB_STEP_SUMMARY" || true

      # Always, including after a failure: a decoded keystore must not outlive
      # the job on a runner, however the job ended.
      - id: shred
        name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.keystore"

  report-gate-failure:
    needs: gate
    # `needs.gate.result` rather than `failure()`: a CANCELLED gate is not a
    # failure, so `failure()` produced no "nothing shipped" line for it (#165).
    #
    # SETTLED, 2026-09-22, and not in this job's favour. Run 35783678379 —
    # the first `v0.1.0` tag, whose gate was cancelled by the battery's
    # timeout — recorded `gate / mutations: cancelled`, `ship: skipped` and
    # `report-gate-failure: SKIPPED`. So a cancelled gate announces nothing
    # at all, which is what the paragraph below feared and what this comment
    # used to call untested (#257).
    #
    # The gap is ACCEPTED rather than closed: `if: always()` does not help,
    # because GitHub skips a dependent job of a cancelled one instead of
    # evaluating its condition, and the notifier that would work keys on
    # `workflow_run` — new infrastructure on the release path, which is not a
    # fix-pass change. What the acceptance rests on: nothing ships (`ship`
    # needs this gate), and the cancellation is visible in the Actions list
    # and on the PR. What it costs: nobody is told.
    #
    # The paragraph this replaces, kept because it was right: when a
    # run is cancelled GitHub cancels its dependent jobs rather than
    # evaluating their `if:`, so this job may well not run for a cancelled
    # gate either. The change is still right — `result != 'success'` is
    # broader than `failure()` and costs nothing — but the cancelled case is
    # a claim nobody has tested, and it needs a cancelled run to settle
    # (#180, #196).
    if: needs.gate.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: say
        name: Say nothing shipped
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "gate failed on $TAG; nothing shipped" \
            | tee -a "$GITHUB_STEP_SUMMARY"
