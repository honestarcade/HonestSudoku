# The pull-request gate.
#
# It runs the same script a contributor runs locally — tools/gate.sh — rather
# than restating its steps, so "green locally" and "green in CI" cannot drift
# into meaning different things. A step added to the gate is a step CI gains.
#
# The invariant guards run as their own named step before the full gate, so a
# breached project invariant is the first red line in the checks list rather
# than something to find inside a long log. They run twice in total; the second
# run is inside gate.sh. Since #26 that repeat includes the engine property
# guards (52 s for the four files, measured 2026-09-23 with a local
# `flutter test` over them), which #26 accepted to keep the gate and CI
# running the same command. Both runs leave out the `weekly` engine tier
# and the `bench` timings (dart_test.yaml says what runs where).
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  # NOT `administration: read`. It was added here for #228 so the ruleset
  # guard could read `bypass_actors` in CI, and it is not a permission
  # GITHUB_TOKEN can be granted at all: the workflow failed validation, zero
  # jobs ran, and the required-check binding refused the merge. That field
  # is read with HS_RULESET_READ_TOKEN instead — a fine-grained PAT with
  # repository Administration read-only, the owner's decision of 2026-09-22
  # — handed to each guard run below in place of `github.token`.

concurrency:
  group: ci-${{ github.ref }}
  # Not `true`. This file is `workflow_call`ed by release.yml, which declares
  # `cancel-in-progress: false` — but the gate that does the work runs in THIS
  # group, so on a tag ref a second run would cancel a release's own gate.
  # That is one keystroke from what happened on 2026-09-22, when `v0.1.0` was
  # deleted and re-cut while its first run had just ended (#261). A pull
  # request still cancels its superseded runs; a tag never does.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7

      # Before the toolchain, because it takes seconds and a broken script is
      # cheaper to learn about now than after a four-minute setup.
      - id: shellcheck
        name: Shellcheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./tools
          severity: warning

      - id: java
        name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # flutter-version-file reads .fvmrc, the single place the exact version
      # is pinned. tools/gate.sh reads the same file and warns when a local
      # Flutter differs from it.
      - id: flutter
        name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - id: deps
        name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - id: guards
        name: Invariant guards
        # The ruleset guard reads the public rulesets endpoint, and one
        # field of it — `bypass_actors` — only for a token with repository
        # Administration (#228). Anonymous reads are also 60/hr per IP and
        # runners share addresses, which is why every guard run below is
        # authenticated whichever token it gets (#219).
        env:
          # HS_RULESET_READ_TOKEN can read `bypass_actors`; `github.token`
          # cannot (#228). The fallback is for a fork, whose PRs cannot see
          # the secret: it keeps them on `github.token` and the skip path
          # rather than failing to start. A LAPSED token is not that case —
          # the secret is still non-empty, so the flag below is set, the
          # dead token goes to GitHub and the 401 is a failure (#239).
          GITHUB_TOKEN: ${{ secrets.HS_RULESET_READ_TOKEN || github.token }}
          # And the guard is TOLD the token is there, so that an absent
          # field then fails instead of skipping: a lapsed secret must be
          # loud, because a skip on a required check is a silent downgrade.
          HS_RULESET_READ_EXPECTED: ${{ secrets.HS_RULESET_READ_TOKEN != '' && '1' || '' }}
        run: flutter test --no-pub --tags guard --exclude-tags weekly,bench

      - id: gate
        name: Quality gate
        # gate.sh runs the guard suite again, ruleset test included, so this
        # step makes the same API call the `guards` step does. Without the
        # token it is an anonymous call per PR from a shared runner IP — the
        # one most likely to eat the 403 the token exists to avoid (#230).
        env:
          # HS_RULESET_READ_TOKEN can read `bypass_actors`; `github.token`
          # cannot (#228). The fallback is for a fork, whose PRs cannot see
          # the secret: it keeps them on `github.token` and the skip path
          # rather than failing to start. A LAPSED token is not that case —
          # the secret is still non-empty, so the flag below is set, the
          # dead token goes to GitHub and the 401 is a failure (#239).
          GITHUB_TOKEN: ${{ secrets.HS_RULESET_READ_TOKEN || github.token }}
          # And the guard is TOLD the token is there, so that an absent
          # field then fails instead of skipping: a lapsed secret must be
          # loud, because a skip on a required check is a silent downgrade.
          HS_RULESET_READ_EXPECTED: ${{ secrets.HS_RULESET_READ_TOKEN != '' && '1' || '' }}
        run: tools/gate.sh

      # Only on a pull request: a workflow_call from the release workflow
      # builds its own signed bundle and uploads that one instead.
      - id: artifact
        name: Upload unsigned bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: honest-sudoku-aab-${{ github.sha }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error

  # The guards' own gate. Every fix in this project began as a defect that
  # the suite reported green, so "the suite passes" is not evidence that the
  # suite can fail. tools/mutation_check.py reintroduces every known defect one
  # at a time and requires the guards to catch each one, naming the assertion
  # that must fire — a mutation that merely turns the suite red some other
  # way is reported as WRONG-REASON, not a pass.
  #
  # Its own job rather than a step in gate.sh: it runs the guard suite once
  # per mutation, which is minutes, and tools/gate.sh is the script a
  # contributor runs locally before every commit.
  mutations:
    runs-on: ubuntu-latest
    # Measured, not guessed, and the number it is measured against is
    # `tools/mutation_check.py --list` rather than one written here — a count
    # in this comment was stale within the same commit that wrote it (#251).
    #
    # The history this budget exists for: 102 entries hit a 30-minute limit
    # exactly and were cancelled with an empty log; 45 minutes then held
    # until the battery reached 127, where this job took 42m52s on one run
    # (35770339392) and 45m22s on the next (35783678379) — the second was
    # cancelled at the limit and took the first release with it (#252).
    #
    # Each mutation is one run of the guard suite, so the cost is linear in
    # the battery's size and the run-to-run variance is minutes, not seconds.
    # 60 was the limit until run 35932979896 (2026-09-23) reached entry 131
    # of 147 when it expired, every entry caught, at about 26 s an entry.
    # Splitting across jobs is the lasting answer, but the one required
    # `mutations` check would then hang on an aggregating job that must run
    # even when a shard fails -- a job-level `if:` that ci-shape refuses,
    # for good reason -- so it waits on #286. 90 is the stopgap;
    # a pass that adds entries re-reads this line.
    timeout-minutes: 90
    env:
      FLUTTER_SUPPRESS_ANALYTICS: "true"
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v7

      - id: java
        name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - id: flutter
        name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true

      - id: deps
        name: Resolve dependencies
        run: flutter pub get --enforce-lockfile

      - id: mutations
        name: Mutation battery
        # One suite run per mutation, so this job alone makes one call to
        # that endpoint per entry in the battery — over a hundred, and
        # `--list` says how many today. Anonymous it would exhaust the
        # hourly limit partway through and report the remainder as
        # WRONG-REASON (#219).
        env:
          # HS_RULESET_READ_TOKEN can read `bypass_actors`; `github.token`
          # cannot (#228). The fallback is for a fork, whose PRs cannot see
          # the secret: it keeps them on `github.token` and the skip path
          # rather than failing to start. A LAPSED token is not that case —
          # the secret is still non-empty, so the flag below is set, the
          # dead token goes to GitHub and the 401 is a failure (#239).
          GITHUB_TOKEN: ${{ secrets.HS_RULESET_READ_TOKEN || github.token }}
          # And the guard is TOLD the token is there, so that an absent
          # field then fails instead of skipping: a lapsed secret must be
          # loud, because a skip on a required check is a silent downgrade.
          HS_RULESET_READ_EXPECTED: ${{ secrets.HS_RULESET_READ_TOKEN != '' && '1' || '' }}
          # Python buffers stdout when it is not a terminal, so a cancelled
          # job left NO progress lines — not one `[N/102]`. Unbuffered, the
          # log shows how far it got and which entry was running.
          PYTHONUNBUFFERED: "1"
        run: tools/mutation_check.py
