name: honest_sudoku
description: "Honest Sudoku — a fully offline Sudoku game for Android."
publish_to: 'none' # never published to pub.dev

version: 0.1.0+1

environment:
  sdk: ^3.13.4
  # A range, not a pin: an exact version here makes `flutter pub get`
  # refuse every other one. The exact version CI uses is in .fvmrc,
  # and a guard asserts the two agree (#18).
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  path_provider: ^2.1.6 # why: locate the app's private storage directory; declares no permissions (manifest checked 2026-09-23)
  url_launcher: ^6.3.2 # why: open the About links in the system browser; declares no permissions (manifest checked 2026-09-23)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_driver: # why: drives the app on an emulator for the Play screenshots (#57); SDK, pure Dart, dev only
    sdk: flutter
  flutter_lints: ^6.0.0
  # Test-only. It never ships: `flutter build` does not resolve
  # dev_dependencies, and the release bundle is byte-scanned every run.
  yaml: ^3.1.4 # why: guards must assert workflow STRUCTURE; a line scan cannot (#154)

flutter:
  uses-material-design: true

  # The whole directory, so a real clip replaces its placeholder by dropping
  # the file in, with no change here (#49).
  assets:
    - assets/audio/

  # Bundled, never fetched (invariant 1). tools/fetch_fonts.sh downloaded them
  # from pinned commits; assets/fonts/README.md records where from (#47).
  fonts:
    - family: Outfit
      fonts:
        - asset: assets/fonts/Outfit-Light.ttf
          weight: 300
        - asset: assets/fonts/Outfit-Regular.ttf
          weight: 400
        - asset: assets/fonts/Outfit-Medium.ttf
          weight: 500
        - asset: assets/fonts/Outfit-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Outfit-Bold.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
