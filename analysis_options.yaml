# Static analysis is the always-on quality layer for this project.
#
# The gate (`tools/gate.sh`, and CI in M1) runs `dart analyze --fatal-infos`, so
# an INFO is as blocking as an error here. That is deliberate: a severity that
# never fails a build is a severity nobody reads.
#
# `dart format --output=none --set-exit-if-changed .` must pass as well. Any
# rule turned off below carries a one-line rationale.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # TODOs are raised to info so editors surface them in review.
    #
    # This does NOT block the gate at `info`, and the comment here once
    # claimed it did (#107). Its replacement then claimed `dart analyze`
    # never reports `todo` "at any severity" and that blocking TODOs "would
    # need a separate check" — both false, and both written in the edit that
    # corrected the first claim (#122).
    #
    # Measured on 2026-09-20, one severity at a time, with
    # `// TODO: x` appended to lib/main.dart and `dart analyze --fatal-infos`:
    #
    #   todo: info      No issues found!   exit 0
    #   todo: warning   1 issue found.     exit 3
    #   todo: error     1 issue found.     exit 3
    #
    # So `info` is the one severity that is suppressed, and it is the one
    # this file uses. Changing this single line to `warning` would block the
    # gate on every TODO. That is a decision about whether TODOs should be
    # bannable in a project this young — it is a config line, and the
    # previous comment said it was not because it generalised from the one
    # severity it had tested.
    todo: info
  exclude:
    - build/**
    - android/**

linter:
  rules:
    # Consistency rules beyond the flutter_lints defaults.
    prefer_single_quotes: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    unawaited_futures: true
    avoid_dynamic_calls: true
    directives_ordering: true
    # sort_pub_dependencies is off: Flutter convention lists `flutter: sdk:` first, which the rule flags.
    sort_pub_dependencies: false
    use_super_parameters: true
    require_trailing_commas: true
