# Static analysis is the always-on quality layer for this project.
#
# The gate (`tools/gate.sh`, and CI in M1) runs `dart analyze --fatal-infos`, so
# an INFO is as blocking as an error here. That is deliberate: a severity that
# never fails a build is a severity nobody reads.
#
# `dart format --output=none --set-exit-if-changed .` must pass as well. Any
# rule turned off below carries a one-line rationale.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # TODOs are info, and the gate makes info fatal — so a TODO is visible in
    # review AND blocks the gate. Land the work or open an issue; do not leave
    # a note in the source and call it tracked.
    todo: info
  exclude:
    - build/**
    - android/**

linter:
  rules:
    # Consistency rules beyond the flutter_lints defaults.
    prefer_single_quotes: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    unawaited_futures: true
    avoid_dynamic_calls: true
    directives_ordering: true
    # sort_pub_dependencies is off: Flutter convention lists `flutter: sdk:` first, which the rule flags.
    sort_pub_dependencies: false
    use_super_parameters: true
    require_trailing_commas: true
