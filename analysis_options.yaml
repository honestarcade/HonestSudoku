# Static analysis is the always-on quality layer for this project.
#
# The gate (`tools/gate.sh`, and CI in M1) runs `dart analyze --fatal-infos`, so
# an INFO is as blocking as an error here. That is deliberate: a severity that
# never fails a build is a severity nobody reads.
#
# `dart format --output=none --set-exit-if-changed .` must pass as well. Any
# rule turned off below carries a one-line rationale.
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # TODOs are raised to info so editors surface them in review.
    #
    # This does NOT block the gate, and the comment here used to claim it did.
    # `dart analyze` does not report the `todo` diagnostic from the command
    # line at any severity, so `--fatal-infos` never sees one: appending
    # `// TODO: x` to a source file and running the gate prints
    # `No issues found!` (#107). `--fatal-infos` itself works — a real
    # info-level lint does fail the gate — the gap is specific to TODOs.
    #
    # Blocking them would need a separate check, and that is a decision about
    # whether TODOs should be bannable in a project this young rather than a
    # config line. Until someone makes it, this comment says what is true.
    todo: info
  exclude:
    - build/**
    - android/**

linter:
  rules:
    # Consistency rules beyond the flutter_lints defaults.
    prefer_single_quotes: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    unawaited_futures: true
    avoid_dynamic_calls: true
    directives_ordering: true
    # sort_pub_dependencies is off: Flutter convention lists `flutter: sdk:` first, which the rule flags.
    sort_pub_dependencies: false
    use_super_parameters: true
    require_trailing_commas: true
